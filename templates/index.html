<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SmashSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<h1>🥊 K.O SENSE</h1>

<div class="layout">

  <div>
    <div class="card">
      <div id="intensidade">Aguardando golpe...</div>
      <div id="forca" style="color:#fff">0</div>
      <div class="unidade">Newtons (N)</div>
      <div id="intervalo"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="st-total">0</div>
        <div class="stat-lbl">Golpes</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="st-max" style="color:#ff6b00">0</div>
        <div class="stat-lbl">Máximo N</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="st-media" style="color:#4fc3f7">0</div>
        <div class="stat-lbl">Média N</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="config-titulo">⚙ Configuração</div>

    <div class="campo">
      <label>Massa do braço + luva (kg)</label>
      <input type="number" id="cfg-massa" step="0.1" min="0.5" max="5">
    </div>
    <div class="campo">
      <label>Fator piezoelétrico (calibração)</label>
      <input type="number" id="cfg-fator" step="1" min="1" max="500">
    </div>

    <button class="btn-salvar" onclick="salvarConfig()">Aplicar</button>
    <div class="status-config" id="status-config"></div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
